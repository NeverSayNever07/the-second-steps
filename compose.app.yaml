# Runs the Zayto proof of concept in a container.
#   1. Copy .env.docker.example to .env.docker and fill in the values.
#   2. docker compose -f compose.app.yaml up --build
#   3. Open http://localhost:3000
# See docs/DOCKER.md.
services:
  app:
    build: .
    image: zayto-app:poc
    # Only this computer can reach the app. Quick sign-in lets anyone who can
    # open it act as the Account Owner, so do not widen this to the network
    # without a password-protecting proxy or VPN in front (docs/DOCKER.md).
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.docker
    restart: unless-stopped
